aid: alume-biosciences
name: Alume Biosciences
description: 'Alume Biosciences is a clinical-stage biotechnology company in La Jolla, California,
  developing nerve-targeted fluorescent agents for precision surgery. Its lead candidate, bevonescein
  (ALM-488) — a peptide-dye conjugate co-invented by the late Nobel Laureate Dr. Roger Tsien and
  surgeon Dr. Quyen Nguyen — is administered intravenously roughly an hour before an operation so
  surgeons can see nerves illuminated in the surgical field and avoid inadvertent nerve injury. The
  compound has FDA Fast Track designation, is in Phase 3 pivotal trials in head-and-neck surgery, and
  the company has stated it plans a New Drug Application submission in 2026. Alume is a drug developer,
  not a software vendor: it publishes no developer program, API, SDK or machine-readable specification.'
